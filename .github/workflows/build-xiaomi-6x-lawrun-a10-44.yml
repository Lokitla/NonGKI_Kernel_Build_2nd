name: Build Xiaomi Mi 6X (LawRun Based A10) (Kernel 4.4)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME: "xiaomi_mi_6x"
  DEVICE_CODENAME: "wayne"

  # Build commands — 4.4 kernel: NO LLVM=1/LLVM_IAS=1 (only for >=4.19)
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: ""

  # Kernel Source — LawRun SDM660 kernel (4.4.302, has wayne_defconfig)
  KERNEL_SOURCE: "https://github.com/negrroo/LawRun_xiaomi_sdm660_All.git"
  KERNEL_BRANCH: "master"

  # Toolchain — matching LawRun CI (Clang 11.0 + GCC 4.9)
  CLANG_SOURCE: "https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-7211189.git"
  CLANG_BRANCH: "11.0"

  GCC_GNU: false
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-18.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-18.1"

  # Defconfig — standalone, no merge configs needed
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "wayne_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # KernelSU
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "resukisu"

  # SUSFS — inline fix for cmdline.c rejection (LawRun uses proc_command_line)
  SUSFS_ENABLE: true
  SUSFS_FIXED: false

  # AnyKernel3
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "lawrun_a10_4.4"

  # Other env
  PYTHON_VERSION: "3"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "true"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Xiaomi Mi 6X (LawRun Based A10) (Kernel 4.4)
    runs-on: ubuntu-24.04
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⛔️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔧 Fix SUSFS cmdline.c (LawRun proc_command_line)
        if: env.SUSFS_ENABLE == 'true'
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # LawRun kernel uses proc_command_line instead of saved_command_line,
          # causing the SUSFS patch to reject on fs/proc/cmdline.c.
          # This step adds the SUSFS spoof code inline — no external patch file needed.
          if grep -q "susfs_spoof_cmdline_or_bootconfig" fs/proc/cmdline.c; then
            echo "[+] cmdline.c already has SUSFS spoof code, skipping"
          else
            echo "[+] Adding SUSFS spoof code to fs/proc/cmdline.c"
            cat > /tmp/cmdline_spoof_fix.patch << 'PATCH'
--- a/fs/proc/cmdline.c
+++ b/fs/proc/cmdline.c
@@ -4,6 +4,12 @@
 #include <linux/seq_file.h>
 #include <asm/setup.h>
 
+#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
+extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;
+extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);
+#endif
+
 #if defined(CONFIG_INITRAMFS_IGNORE_SKIP_FLAG) || \
     defined(CONFIG_PROC_CMDLINE_APPEND_ANDROID_FORCE_NORMAL_BOOT)
 #define INITRAMFS_STR_FIND "skip_initramf"
@@ -48,6 +54,13 @@
 
 static int cmdline_proc_show(struct seq_file *m, void *v)
 {
+#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
+	if (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {
+		susfs_spoof_cmdline_or_bootconfig(m);
+		seq_putc(m, '\\n');
+		return 0;
+	}
+#endif
 	seq_printf(m, "%s\n", proc_command_line);
 	return 0;
 }
PATCH
            patch -p1 < /tmp/cmdline_spoof_fix.patch
            echo "[+] SUSFS spoof code added to cmdline.c"
          fi

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🔧 Fix BBG Selinux Makefile
        if: env.BASEBAND_GUARD_ENABLE == 'true'
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Fix: # in sepatch.txt is treated as Make comment, causing "invalid syntax in conditional"
          sed -i 's/#define DEFINE_LSM/\\#define DEFINE_LSM/' security/selinux/Makefile

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
